<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add a bottle</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');

    * { font-family: "Roboto Mono", monospace; box-sizing: border-box; }

    body { background: #fdfdfd; margin: 0; padding: 2em 1em; color: #111; }

    .form-wrapper {
      margin: 0 auto; max-width: 680px; background: #fff;
      padding: 2em 2.5em; border: 3px solid #000; box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.4);
    }

    h2 { text-align: center; margin: 0 0 1em; }

    fieldset { border: 2px solid #000; margin: 0 0 1.5em; padding: 1em 1.2em; }
    legend { font-weight: 700; padding: 0 0.4em; }

    .field { margin-bottom: 1em; }
    label { font-weight: 700; display: block; margin-bottom: 0.3em; }
    .required::after { content: " *"; color: #b00; }

    input, select {
      width: 100%; padding: 0.55em 0.7em; border: 2px solid #333; border-radius: 0;
      font-size: 1em; background: #fff; color: #111; box-shadow: 2px 2px 0 #ccc;
    }
    input:focus, select:focus { outline: none; border-color: #000; box-shadow: 2px 2px 0 #555; }

    .with-unit { display: flex; gap: 0.5em; align-items: center; }
    .with-unit span { white-space: nowrap; color: #444; }
    .description, .hint { font-size: 0.85em; color: #666; margin-top: 0.3em; }

    /* the picked compound */
    .compound-card { border: 2px dashed #999; padding: 0.6em 0.8em; margin-top: 0.5em; font-size: 0.9em; }
    .chip {
      display: inline-block; padding: 0.15em 0.5em; margin: 0.3em 0.3em 0 0;
      border: 2px solid #000; font-size: 0.8em; font-weight: 700;
    }
    .chip.hazard { background: #ffe9a8; }
    .chip.peroxide { background: #ffc9c9; }
    .chip.none { background: #eee; font-weight: 400; }

    .banner { border: 2px solid #b00; background: #fff0f0; padding: 0.8em 1em; margin-bottom: 1.5em; }
    .banner a { color: #b00; font-weight: 700; }

    pre { background: #f4f4f4; border: 2px solid #ccc; padding: 0.8em; overflow-x: auto; font-size: 0.8em; }

    .back { display: inline-block; margin-bottom: 1em; color: #111; }
  </style>
</head>
<body>
  <div class="form-wrapper">
    <a class="back" href="/">← Back</a>
    <h2>Add a bottle</h2>

    <!-- shown when the server answers 401 (no or wrong API key) -->
    <div id="login-banner" class="banner" hidden>
      You're not logged in. Open the <a href="/">start page</a>, enter your eLabFTW API key, then come back.
    </div>

    <form id="bottle-form" novalidate>
      <div class="field">
        <label for="category" class="required">Category</label>
        <select id="category"></select>
      </div>

      <!-- 1. WHAT: one picker per compound the category needs (filled by add_bottle.js) -->
      <fieldset id="what-section">
        <legend>1. What is in it</legend>
        <div id="compound-pickers"></div>
        <datalist id="compound-options"></datalist>
      </fieldset>

      <!-- 4. THIS BOTTLE: name + the template's fields that stay on the bottle -->
      <fieldset>
        <legend>This bottle</legend>
        <div class="field">
          <label for="title" class="required">Name</label>
          <input id="title" type="text" autocomplete="off" />
          <div class="hint">Filled in from the chemical; you can change it.</div>
        </div>
        <div id="bottle-fields"></div>
      </fieldset>

      <!-- for now: what the Create button will send (replaced by the button in D4d) -->
      <fieldset>
        <legend>What "Create" will send</legend>
        <pre id="preview">{}</pre>
      </fieldset>
    </form>
  </div>

  <script src="static/add_bottle.js"></script>
</body>
</html>
